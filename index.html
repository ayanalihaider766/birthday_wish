<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Nida ❤️</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ OPENING GIFT SCENE ============ -->
  <section id="opening" aria-label="Open your gift">
    <div class="op-bg">
      <canvas id="particleCanvas"></canvas>
      <div class="op-glow op-glow--1"></div>
      <div class="op-glow op-glow--2"></div>
    </div>

    <div class="gift-stage">
      <div class="gift-card" id="giftCard">
        <div class="gift-card__face">
          <p class="gift-eyebrow">a little something, for you</p>
          <div class="css-heart css-heart--card" aria-hidden="true">
            <span></span><span></span>
          </div>
          <p class="gift-hint" id="giftHint">pull &amp; release</p>
        </div>
      </div>

      <svg class="string-svg" id="stringSvg" viewBox="0 0 200 260" preserveAspectRatio="none" aria-hidden="true">
        <path id="stringPath" d="M100,0 L100,80" />
